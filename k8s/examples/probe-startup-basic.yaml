apiVersion: v1
kind: Pod
metadata:
  name: spring-app-startup
  labels:
    app: spring-app
spec:
  containers:
  - name: spring-app
    image: your-spring-app:1.0
    ports:
    - containerPort: 8080

    startupProbe:
      httpGet:
        path: /actuator/health
        port: 8080
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 30      # 최대 150초(5초 * 30회) 동안 시도

    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
