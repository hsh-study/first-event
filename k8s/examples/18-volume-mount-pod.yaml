apiVersion: v1
kind: Pod
metadata:
  name: firstevent-volume
spec:
  containers:
  - name: app
    image: nginx:1.21
    volumeMounts:
    - name: config-volume
      mountPath: /app/config
      readOnly: true
    - name: secret-volume
      mountPath: /app/secrets
      readOnly: true
  volumes:
  - name: config-volume
    configMap:
      name: springboot-config
  - name: secret-volume
    secret:
      secretName: db-secret
