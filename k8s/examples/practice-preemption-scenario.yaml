# 1단계: 낮은 우선순위 Pod로 리소스 채우기
apiVersion: apps/v1
kind: Deployment
metadata:
  name: low-priority-filler
spec:
  replicas: 5
  selector:
    matchLabels:
      app: filler
  template:
    metadata:
      labels:
        app: filler
    spec:
      priorityClassName: low
      containers:
        - name: filler
          image: nginx:1.21
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
# 2단계: 높은 우선순위 Pod 생성
apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-priority-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: high-priority-app
  template:
    metadata:
      labels:
        app: high-priority-app
    spec:
      priorityClassName: critical
      containers:
        - name: app
          image: nginx:1.21
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi