apiVersion: batch/v1
kind: CronJob
metadata:
  name: forbid-concurrent
  labels:
    cronjob: forbid-concurrent
spec:
  schedule: "*/1 * * * *"  # 매 1분마다
  concurrencyPolicy: Forbid  # 동시 실행 금지
  jobTemplate:
    metadata:
      labels:
        cronjob: forbid-concurrent
    spec:
      template:
        metadata:
          labels:
            cronjob: forbid-concurrent
        spec:
          containers:
          - name: long-running
            image: busybox
            command:
            - /bin/sh
            - -c
            - echo "Starting job at $(date)"; sleep 120; echo "Finished job at $(date)"
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
