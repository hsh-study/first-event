apiVersion: v1
kind: Pod
metadata:
  name: hostpath-example
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    volumeMounts:
    - name: host-data
      mountPath: /usr/share/nginx/html  # nginx의 웹 루트 디렉토리

  volumes:
  - name: host-data
    hostPath:
      path: /data/nginx  # 노드(호스트)의 경로
      type: DirectoryOrCreate  # 디렉토리가 없으면 생성

# type 옵션:
# - DirectoryOrCreate: 디렉토리가 없으면 생성
# - Directory: 반드시 디렉토리가 존재해야 함
# - FileOrCreate: 파일이 없으면 생성
# - File: 반드시 파일이 존재해야 함
# - Socket: Unix 소켓이어야 함
# - CharDevice: 문자 디바이스여야 함
# - BlockDevice: 블록 디바이스여야 함
