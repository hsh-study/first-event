apiVersion: v1
kind: Pod
metadata:
  name: nginx-guaranteed
  labels:
    qos: guaranteed
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "512Mi"
        cpu: "500m"
