apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-probe-test
  labels:
    app: nginx-probe-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-probe-test
  template:
    metadata:
      labels:
        app: nginx-probe-test
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
          name: http

        startupProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12

        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-probe-test-service
spec:
  selector:
    app: nginx-probe-test
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
