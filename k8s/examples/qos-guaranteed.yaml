apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-pod
  labels:
    qos: guaranteed
spec:
  containers:
  - name: app
    image: your-spring-app:1.0
    resources:
      requests:
        memory: "1Gi"
        cpu: "1000m"
      limits:
        memory: "1Gi"      # requests와 동일
        cpu: "1000m"       # requests와 동일

  - name: sidecar
    image: nginx:1.21
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "256Mi"    # requests와 동일
        cpu: "250m"        # requests와 동일
