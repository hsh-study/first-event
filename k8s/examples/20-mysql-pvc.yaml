# MySQL용 PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/mysql-data
    type: DirectoryOrCreate
---
# MySQL용 PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
# MySQL Pod
apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  labels:
    app: mysql
spec:
  containers:
  - name: mysql
    image: mysql:8.0
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "secret"  # 실제 환경에서는 Secret 사용 권장
    - name: MYSQL_DATABASE
      value: "mydb"
    ports:
    - containerPort: 3306
      name: mysql
    volumeMounts:
    - name: mysql-storage
      mountPath: /var/lib/mysql  # MySQL 데이터 디렉토리

    # MySQL이 정상적으로 시작될 때까지 대기
    readinessProbe:
      exec:
        command:
        - mysqladmin
        - ping
        - -h
        - localhost
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5

  volumes:
  - name: mysql-storage
    persistentVolumeClaim:
      claimName: mysql-pvc

# 실습 참고:
# 1. PV, PVC, Pod가 모두 이 파일에 포함되어 있음
# 2. MySQL 데이터는 /var/lib/mysql에 저장됨
# 3. PVC를 통해 데이터가 Pod 삭제 후에도 유지됨
# 4. 실제 환경에서는 Secret으로 비밀번호 관리
