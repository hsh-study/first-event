# OnDelete 업데이트 전략 DaemonSet
# Pod를 수동으로 삭제할 때만 새 버전으로 업데이트됨
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ondelete-daemon
  labels:
    app: ondelete-daemon
spec:
  selector:
    matchLabels:
      app: ondelete-daemon
  # OnDelete 업데이트 전략
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app: ondelete-daemon
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: VERSION
          value: "1.21"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command:
        - sh
        - -c
        - |
          echo "Running nginx:1.21 on $NODE_NAME" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'
