apiVersion: v1
kind: Pod
metadata:
  name: frontend-prod
  labels:
    app: frontend
    env: production
    version: v1
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-dev
  labels:
    app: frontend
    env: development
    version: v1
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-prod
  labels:
    app: backend
    env: production
    version: v2
spec:
  containers:
  - name: app
    image: hashicorp/http-echo:latest
    args:
    - "-text=Backend API v2"
    ports:
    - containerPort: 5678
