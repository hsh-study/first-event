# LimitRange 최대값을 초과하는 Pod
# 생성 실패 예제 (max CPU is 2, but limit is 3)
apiVersion: v1
kind: Pod
metadata:
  name: exceed-limits-pod
spec:
  containers:
  - name: app
    image: nginx:1.21
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 3  # LimitRange max는 2
        memory: 2Gi
