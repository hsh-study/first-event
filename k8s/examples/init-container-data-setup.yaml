apiVersion: v1
kind: Pod
metadata:
  name: app-with-data-init
spec:
  initContainers:
  - name: setup-data
    image: busybox:1.35
    command:
    - sh
    - -c
    - |
      echo "Setting up initial data..."
      mkdir -p /data/logs
      mkdir -p /data/cache
      echo "Initial setup completed at $(date)" > /data/init.log
      chmod -R 777 /data
    volumeMounts:
    - name: data-volume
      mountPath: /data

  containers:
  - name: spring-app
#    image: your-spring-app:1.0
    image: openjdk:17-slim
    volumeMounts:
    - name: data-volume
      mountPath: /app/data

  volumes:
  - name: data-volume
    emptyDir: {}
