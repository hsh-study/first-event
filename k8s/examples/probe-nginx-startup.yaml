apiVersion: v1
kind: Pod
metadata:
  name: nginx-startup
  labels:
    app: nginx-probe
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80

    startupProbe:
      httpGet:
        path: /index.html
        port: 80
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 30

    livenessProbe:
      httpGet:
        path: /index.html
        port: 80
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /index.html
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
