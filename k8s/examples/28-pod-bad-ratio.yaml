# limit/request 비율이 LimitRange를 초과하는 Pod
# 생성 실패 예제 (ratio is 10, but max is 4)
apiVersion: v1
kind: Pod
metadata:
  name: bad-ratio-pod
spec:
  containers:
  - name: app
    image: nginx:1.21
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 100m      # 0.1 CPU
        memory: 128Mi
      limits:
        cpu: 1000m     # 1 CPU (ratio = 1/0.1 = 10)
        memory: 512Mi  # ratio = 512/128 = 4
