apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    # 컴퓨팅 리소스
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi

    # 오브젝트 수
    count/pods: "10"
    count/services: "5"
    count/configmaps: "10"
    count/secrets: "10"

    # 스토리지
    requests.storage: 100Gi
    persistentvolumeclaims: "5"
