apiVersion: v1
kind: Pod
metadata:
  name: probe-tcpsocket
spec:
  containers:
  - name: app
    image: your-spring-app:1.0

    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 3
      timeoutSeconds: 2

    livenessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 10
