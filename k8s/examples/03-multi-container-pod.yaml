apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  # 메인 애플리케이션 컨테이너
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html

  # 사이드카 컨테이너 (로그 수집 등의 용도)
  - name: sidecar
    image: busybox:1.35
    command: ["/bin/sh"]
    args:
    - -c
    - |
      mkdir -p /www
      echo "hello from sidecar" > /www/index.html
      httpd -f -p 9000 -h /www
    - |
      while true; do
        echo "$(date) - Sidecar running" >> /data/sidecar.log
        sleep 10
      done
    ports:
    - containerPort: 9000
    volumeMounts:
    - name: shared-data
      mountPath: /data

  volumes:
  - name: shared-data
    emptyDir: {}
