# Fluentd DaemonSet - 로그 수집 시나리오
# 모든 노드에서 로그를 수집하여 중앙 집중식 로깅
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      # 특권 모드 필요 (호스트 로그 접근)
      serviceAccountName: fluentd
      containers:
      - name: fluentd
        image: fluent/fluentd:v1.16-1
        env:
        # Fluentd 설정
        - name: FLUENTD_CONF
          value: fluent.conf
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 500Mi
        volumeMounts:
        # 컨테이너 로그 수집
        - name: varlog
          mountPath: /var/log
          readOnly: true
        # Docker 컨테이너 로그
        - name: dockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        # Fluentd 설정
        - name: fluentd-config
          mountPath: /fluentd/etc
      volumes:
      # 호스트 경로 마운트
      - name: varlog
        hostPath:
          path: /var/log
      - name: dockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluentd-config
        configMap:
          name: fluentd-config
      # 마스터 노드에도 배포 (마스터 노드의 taint 무시)
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        effect: NoSchedule

---
# ServiceAccount (권한 필요)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd

---
# ClusterRole (로그 읽기 권한)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
- kind: ServiceAccount
  name: fluentd
  namespace: default

---
# Fluentd 설정 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    <filter kubernetes.**>
      @type kubernetes_metadata
    </filter>

    <match **>
      @type stdout
    </match>
