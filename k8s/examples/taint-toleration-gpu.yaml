apiVersion: v1
kind: Pod
metadata:
  name: ml-training
spec:
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule

  nodeSelector:
    nvidia.com/gpu: "true"

  containers:
  - name: ml-app
    image: nvidia/cuda:11.8.0-base-ubuntu22.04
    command:
    - sh
    - -c
    - nvidia-smi && sleep 3600
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        nvidia.com/gpu: 1
        cpu: 2000m
        memory: 4Gi
