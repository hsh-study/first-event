apiVersion: v1
kind: Pod
metadata:
  name: multi-port-app
  labels:
    app: multi-port
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
      name: http
  - name: admin
    image: hashicorp/http-echo:latest
    args:
    - "-text=Admin Interface"
    - "-listen=:8080"
    ports:
    - containerPort: 8080
      name: admin
