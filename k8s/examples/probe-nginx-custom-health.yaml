apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-health-config
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 80;

        location / {
          root /usr/share/nginx/html;
          index index.html;
        }

        location /health {
          access_log off;
          return 200 "healthy\n";
          add_header Content-Type text/plain;
        }

        location /ready {
          access_log off;
          return 200 "ready\n";
          add_header Content-Type text/plain;
        }
      }
    }

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-custom-health
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80

    volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf

    readinessProbe:
      httpGet:
        path: /ready
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5

    livenessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 10

  volumes:
  - name: nginx-config
    configMap:
      name: nginx-health-config
