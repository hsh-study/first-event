# Backend Service for Namespace communication practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: backend
    spec:
      containers:
      - name: app
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: backend-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Backend Service</title>
    </head>
    <body>
        <h1>Backend Service</h1>
        <p>This is the backend service running in dev namespace.</p>
        <p>Pod: <span id="hostname"></span></p>
        <script>
          document.getElementById('hostname').textContent = window.location.hostname;
        </script>
    </body>
    </html>

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 80
    name: http
